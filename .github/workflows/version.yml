name: Auto version tag

# Поднимает патч-версию и ставит git-тег на каждый пуш в main.
# Работает на чистом git + встроенный GITHUB_TOKEN, без сторонних actions.

on:
  push:
    branches:
      - main
  workflow_dispatch:      # можно запустить вручную из вкладки Actions

# Нужно право писать в репозиторий, чтобы пушить тег и создавать релиз.
permissions:
  contents: write

# Не запускать несколько прогонов параллельно — чтобы не было гонки за тег.
concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # нужна вся история и теги
          fetch-tags: true

      - name: Compute next version
        id: bump
        run: |
          # Последний тег вида vX.Y.Z; если тегов нет — стартуем с v0.0.0
          latest="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          echo "Последний тег: $latest"

          # Разбираем на major.minor.patch и поднимаем patch
          ver="${latest#v}"
          major="${ver%%.*}"
          rest="${ver#*.}"
          minor="${rest%%.*}"
          patch="${rest##*.}"
          patch=$((patch + 1))

          next="v${major}.${minor}.${patch}"
          echo "Новая версия: $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "$NEXT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          gh release create "$NEXT" \
            --title "$NEXT" \
            --generate-notes
